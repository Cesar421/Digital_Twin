<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 840" role="img" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Sensequake measurement workflow</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Step-by-step workflow for seismic data acquisition using Sensequake sensors, from synchronization to post-processing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Phase label: Setup (two lines) -->
  <!-- Setup bounding box -->
  <rect x="4" y="28" width="616" height="244" rx="6" fill="none" stroke="rgba(83, 74, 183, 0.4)" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="14" y="46" style="font-weight:700;opacity:0.85;fill:rgb(60, 52, 137);stroke:none;font-family:&quot;Segoe UI&quot;, sans-serif;font-size:16px;text-anchor:start;dominant-baseline:auto" transform="translate(-4.25 109.65)">Setup</text>

  <!-- Step 1 header -->
  <g>
    <rect x="60" y="40" width="560" height="52" rx="8" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);"/>
    <text x="340" y="60" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">1. Synchronize the sensors</text>
    <text x="340" y="78" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Connect all sensors to master node</text>
  </g>

  <!-- Sub-steps row -->
  <g>
    <rect x="60" y="118" width="168" height="52" rx="8" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);"/>
    <text x="144" y="138" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">1.1 Sampling rate</text>
    <text x="144" y="156" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Define Hz</text>
  </g>

  <g>
    <rect x="246" y="118" width="168" height="52" rx="8" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);"/>
    <text x="330" y="138" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">1.2 Duration</text>
    <text x="330" y="156" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Total record time</text>
  </g>

  <g>
    <rect x="432" y="118" width="188" height="52" rx="8" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);"/>
    <text x="526" y="138" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">1.3 Delay time</text>
    <text x="526" y="156" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Trigger offset (s)</text>
  </g>

  <!-- Connectors step 1 → sub-steps -->
  <line x1="144" y1="92" x2="144" y2="118" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="330" y1="92" x2="330" y2="118" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="526" y1="92" x2="526" y2="118" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- 1.4 Start measurement -->
  <g>
    <rect x="60" y="196" width="560" height="52" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);"/>
    <text x="340" y="216" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">1.4 Start measurement</text>
    <text x="340" y="234" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Trigger all sensors simultaneously</text>
  </g>

  <!-- Sub-steps → start measurement -->
  <line x1="144" y1="170" x2="144" y2="186" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="330" y1="170" x2="330" y2="186" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="526" y1="170" x2="526" y2="186" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="144" y1="186" x2="526" y2="186" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="340" y1="186" x2="340" y2="196" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- Arrow step 1 → step 2 -->
  <line x1="340" y1="248" x2="340" y2="306" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="358" y="280" style="opacity:0.55;fill:rgb(61, 61, 58);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">Sensors ready</text>

  <!-- Phase label: Field -->
  <!-- Field bounding box -->
  <rect x="4" y="290" width="616" height="196" rx="6" fill="none" stroke="rgba(153, 60, 29, 0.4)" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="14" y="310" style="font-weight:700;opacity:0.85;fill:rgb(113, 43, 19);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:16px;text-anchor:start;dominant-baseline:auto" transform="translate(-2.55 71.4)">Field</text>

  <!-- Step 2 -->
  <g>
    <rect x="60" y="306" width="560" height="56" rx="8" stroke-width="0.5" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);"/>
    <text x="340" y="326" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">2. Deploy sensors and acquire data</text>
    <text x="340" y="346" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Place on structure, let measurement run</text>
  </g>

  <!-- Arrow step 2 → step 3 -->
  <line x1="340" y1="362" x2="340" y2="414" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="358" y="391" style="opacity:0.55;fill:rgb(61, 61, 58);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">Measurement complete</text>

  <!-- Step 3 -->
  <g>
    <rect x="60" y="414" width="560" height="52" rx="8" stroke-width="0.5" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);"/>
    <text x="340" y="434" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">3. Retrieve sensors</text>
    <text x="340" y="452" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Collect all units from structure</text>
  </g>

  <!-- Arrow step 3 → step 4 -->
  <line x1="340" y1="466" x2="340" y2="518" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase label: Post-processing (two lines) -->
  <!-- Post-processing bounding box -->
  <rect x="4" y="500" width="616" height="272" rx="6" fill="none" stroke="rgba(24, 95, 165, 0.4)" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="14" y="522" style="font-weight:700;opacity:0.85;fill:rgb(12, 68, 124);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:16px;text-anchor:start;dominant-baseline:auto" transform="translate(-0.85 74.8)">Post-processing</text>

  <!-- Step 4 header -->
  <g>
    <rect x="60" y="518" width="560" height="52" rx="8" stroke-width="0.5" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);"/>
    <text x="340" y="538" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">4. Retrieve data from each sensor</text>
    <text x="340" y="556" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Export raw acceleration time series</text>
  </g>

  <!-- Fan connector to sub-tasks -->
  <line x1="340" y1="570" x2="340" y2="596" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="144" y1="596" x2="536" y2="596" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="144" y1="596" x2="144" y2="610" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="340" y1="596" x2="340" y2="610" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="536" y1="596" x2="536" y2="610" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- Sub-task: Sync check -->
  <g>
    <rect x="60" y="610" width="168" height="56" rx="8" stroke-width="0.5" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);"/>
    <text x="144" y="630" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">Sync check</text>
    <text x="144" y="650" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Verify time alignment</text>
  </g>

  <!-- Sub-task: Filter + FFT -->
  <g>
    <rect x="246" y="610" width="188" height="56" rx="8" stroke-width="0.5" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);"/>
    <text x="340" y="630" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">Filter + FFT</text>
    <text x="340" y="650" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Bandpass, PSD, spectra</text>
  </g>

  <!-- Sub-task: Modal analysis -->
  <g>
    <rect x="452" y="610" width="168" height="56" rx="8" stroke-width="0.5" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);"/>
    <text x="536" y="630" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">Modal analysis</text>
    <text x="536" y="650" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">Freq, damping, modes</text>
  </g>

  <!-- Sub-tasks converge to output -->
  <line x1="144" y1="666" x2="144" y2="682" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="340" y1="666" x2="340" y2="682" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="536" y1="666" x2="536" y2="682" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="144" y1="682" x2="536" y2="682" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8"/>
  <line x1="340" y1="682" x2="340" y2="700" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- Final output -->
  <g>
    <rect x="60" y="700" width="560" height="56" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);"/>
    <text x="340" y="720" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;">Results archived</text>
    <text x="340" y="740" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:&quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;">CSV / HDF5 + report ready for SHM / ML pipeline</text>
  </g>

</svg>