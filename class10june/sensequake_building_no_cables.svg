<svg width="100%" viewBox="0 0 560 580" xmlns="http://www.w3.org/2000/svg">
  <title>Sensequake Building Sensor Deployment - No Cables</title>
  <desc>Multi-story building with Sensequake sensors on each floor, wireless deployment.</desc>

  <!-- ===== BUILDING STRUCTURE ===== -->

  <!-- Floor slabs (grey fill) -->
  <rect x="116" y="59"  width="308" height="82" fill="rgba(120,120,130,0.18)" stroke="none"/>
  <rect x="116" y="149" width="308" height="82" fill="rgba(120,120,130,0.15)" stroke="none"/>
  <rect x="116" y="239" width="308" height="82" fill="rgba(120,120,130,0.15)" stroke="none"/>
  <rect x="116" y="329" width="308" height="82" fill="rgba(120,120,130,0.15)" stroke="none"/>

  <!-- Horizontal floor lines -->
  <rect x="110" y="55"  width="320" height="4" rx="1" fill="#555"/>
  <rect x="110" y="145" width="320" height="4" rx="1" fill="#555"/>
  <rect x="110" y="235" width="320" height="4" rx="1" fill="#555"/>
  <rect x="110" y="325" width="320" height="4" rx="1" fill="#555"/>
  <rect x="110" y="415" width="320" height="4" rx="1" fill="#555"/>

  <!-- Outer columns -->
  <rect x="110" y="55" width="6"  height="364" fill="#333"/>
  <rect x="424" y="55" width="6"  height="364" fill="#333"/>
  <!-- Inner columns -->
  <rect x="200" y="55" width="4"  height="364" fill="#777"/>
  <rect x="336" y="55" width="4"  height="364" fill="#777"/>

  <!-- ===== FLOOR LABELS ===== -->
  <text x="88" y="103" text-anchor="middle" style="fill:#444;font-size:11px;font-family:'Segoe UI',sans-serif;font-weight:700;">5F</text>
  <text x="88" y="193" text-anchor="middle" style="fill:#444;font-size:11px;font-family:'Segoe UI',sans-serif;font-weight:700;">4F</text>
  <text x="88" y="283" text-anchor="middle" style="fill:#444;font-size:11px;font-family:'Segoe UI',sans-serif;font-weight:700;">3F</text>
  <text x="88" y="373" text-anchor="middle" style="fill:#444;font-size:11px;font-family:'Segoe UI',sans-serif;font-weight:700;">2F</text>
  <text x="88" y="432" text-anchor="middle" style="fill:#444;font-size:11px;font-family:'Segoe UI',sans-serif;font-weight:700;">1F</text>

  <!-- ===== SENSOR MACRO ===== -->
  <!-- Floor 5 — left -->
  <rect x="118" y="36" width="28" height="22" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="122" y="39" width="20" height="7"  rx="1" fill="#e74c3c"/>
  <text x="132" y="53" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7.5px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 5 — right -->
  <rect x="394" y="36" width="28" height="22" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="398" y="39" width="20" height="7"  rx="1" fill="#e74c3c"/>
  <text x="408" y="53" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7.5px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 4 — right -->
  <rect x="394" y="126" width="28" height="22" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="398" y="129" width="20" height="7"  rx="1" fill="#e74c3c"/>
  <text x="408" y="143" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7.5px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 3 — left -->
  <rect x="118" y="216" width="28" height="22" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="122" y="219" width="20" height="7"  rx="1" fill="#e74c3c"/>
  <text x="132" y="233" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7.5px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 2 — left -->
  <rect x="118" y="306" width="28" height="22" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="122" y="309" width="20" height="7"  rx="1" fill="#e74c3c"/>
  <text x="132" y="323" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7.5px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 2 — right -->
  <rect x="394" y="306" width="28" height="22" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="398" y="309" width="20" height="7"  rx="1" fill="#e74c3c"/>
  <text x="408" y="323" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7.5px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 1 — gateway (blue) -->
  <rect x="220" y="396" width="32" height="24" rx="3" fill="#2471a3" stroke="#1a5276" stroke-width="1"/>
  <rect x="224" y="399" width="24" height="8"  rx="1" fill="#5dade2"/>
  <text x="236" y="414" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7px;font-weight:700;font-family:'Segoe UI',sans-serif;">GW</text>



  <!-- ===== GATEWAY DEVICE (ShAkeLog box) ===== -->
  <rect x="28" y="458" width="130" height="88" rx="7" fill="#f5f5f0" stroke="#aaa" stroke-width="1.5"/>
  <rect x="36"  y="466" width="76" height="44" rx="3" fill="white" stroke="#ccc" stroke-width="1"/>
  <!-- ShAkeLog text -->

  <!-- ECG line -->
  <rect x="40" y="470" width="50" height="2" fill="#ccc"/>
  <rect x="40" y="475" width="50" height="2" fill="#ccc"/>
  <rect x="40" y="480" width="50" height="2" fill="#ccc"/>
  <polyline points="40,492 50,492 54,486 58,500 62,486 66,500 70,492 110,492" fill="none" stroke="#c0392b" stroke-width="1.3"/>

  <!-- Sensequake label -->

  <!-- Connectors -->
  <circle cx="48"  cy="528" r="8" fill="#888" stroke="#555" stroke-width="1"/>
  <circle cx="48"  cy="528" r="4" fill="#555"/>
  <circle cx="72"  cy="528" r="8" fill="#888" stroke="#555" stroke-width="1"/>
  <circle cx="72"  cy="528" r="4" fill="#555"/>
  <!-- Antenna -->
  <line x1="148" y1="458" x2="156" y2="438" stroke="#888" stroke-width="1.5"/>
  <circle cx="156" cy="436" r="2.5" fill="#888"/>

  <!-- GATEWAY label -->
  <text x="270" y="448" text-anchor="middle" style="fill:#1a5276;font-size:13px;font-weight:700;font-family:'Segoe UI',sans-serif;">GATEWAY</text>

  <!-- ===== LEGEND ===== -->
  <rect x="358" y="458" width="168" height="62" rx="6" fill="rgba(255,255,255,0.9)" stroke="#ccc" stroke-width="1"/>
  <text x="442" y="475" text-anchor="middle" style="fill:#333;font-size:11px;font-weight:700;font-family:'Segoe UI',sans-serif;">Legend</text>
  <!-- Sensor row -->
  <rect x="370" y="484" width="16" height="12" rx="2" fill="#c0392b" stroke="#7b241c" stroke-width="0.8"/>
  <text x="392" y="494" text-anchor="start" style="fill:#333;font-size:10px;font-family:'Segoe UI',sans-serif;">Sensor (S)</text>
  <!-- Gateway row -->
  <rect x="370" y="504" width="16" height="12" rx="2" fill="#2471a3" stroke="#1a5276" stroke-width="0.8"/>
  <text x="392" y="514" text-anchor="start" style="fill:#333;font-size:10px;font-family:'Segoe UI',sans-serif;">Gateway node</text>


</svg>
