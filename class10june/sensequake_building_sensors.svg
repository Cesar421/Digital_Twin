<svg width="100%" viewBox="0 0 560 620" xmlns="http://www.w3.org/2000/svg">
  <title>Sensequake Building Sensor Deployment</title>
  <desc>Multi-story building with Sensequake sensors on each floor connected to a gateway.</desc>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a7abf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== BUILDING STRUCTURE (isometric-style front view) ===== -->

  <!-- Floor 5 (top) -->
  <rect x="110" y="55" width="320" height="4" rx="1" fill="#555"/>
  <!-- Floor 4 -->
  <rect x="110" y="145" width="320" height="4" rx="1" fill="#555"/>
  <!-- Floor 3 -->
  <rect x="110" y="235" width="320" height="4" rx="1" fill="#555"/>
  <!-- Floor 2 -->
  <rect x="110" y="325" width="320" height="4" rx="1" fill="#555"/>
  <!-- Floor 1 (ground) -->
  <rect x="110" y="415" width="320" height="4" rx="1" fill="#555"/>

  <!-- Left column -->
  <rect x="110" y="55" width="6" height="364" fill="#333"/>
  <!-- Right column -->
  <rect x="424" y="55" width="6" height="364" fill="#333"/>
  <!-- Internal left column -->
  <rect x="200" y="55" width="4" height="364" fill="#666"/>
  <!-- Internal right column -->
  <rect x="336" y="55" width="4" height="364" fill="#666"/>

  <!-- Floor slabs (grey fill) -->
  <rect x="116" y="59" width="308" height="82" fill="rgba(120,120,130,0.25)" stroke="none"/>
  <rect x="116" y="149" width="308" height="82" fill="rgba(120,120,130,0.20)" stroke="none"/>
  <rect x="116" y="239" width="308" height="82" fill="rgba(120,120,130,0.20)" stroke="none"/>
  <rect x="116" y="329" width="308" height="82" fill="rgba(120,120,130,0.20)" stroke="none"/>

  <!-- ===== SENSORS (red boxes) ===== -->
  <!-- Floor 5 left sensor -->
  <rect x="118" y="38" width="26" height="20" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="122" y="41" width="18" height="6" rx="1" fill="#e74c3c"/>
  <text x="131" y="53" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 5 right sensor -->
  <rect x="396" y="38" width="26" height="20" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="400" y="41" width="18" height="6" rx="1" fill="#e74c3c"/>
  <text x="409" y="53" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 4 right sensor -->
  <rect x="396" y="128" width="26" height="20" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="400" y="131" width="18" height="6" rx="1" fill="#e74c3c"/>
  <text x="409" y="143" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 3 left sensor -->
  <rect x="118" y="218" width="26" height="20" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="122" y="221" width="18" height="6" rx="1" fill="#e74c3c"/>
  <text x="131" y="233" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 2 right sensor -->
  <rect x="396" y="308" width="26" height="20" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="400" y="311" width="18" height="6" rx="1" fill="#e74c3c"/>
  <text x="409" y="323" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- Floor 2 left sensor -->
  <rect x="118" y="308" width="26" height="20" rx="3" fill="#c0392b" stroke="#7b241c" stroke-width="1"/>
  <rect x="122" y="311" width="18" height="6" rx="1" fill="#e74c3c"/>
  <text x="131" y="323" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:7px;font-weight:700;font-family:'Segoe UI',sans-serif;">S</text>

  <!-- ===== GATEWAY (blue box, ground floor) ===== -->
  <!-- Gateway sensor left -->
  <rect x="186" y="398" width="30" height="22" rx="3" fill="#2471a3" stroke="#1a5276" stroke-width="1"/>
  <rect x="190" y="401" width="22" height="7" rx="1" fill="#5dade2"/>
  <text x="201" y="415" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:6.5px;font-weight:700;font-family:'Segoe UI',sans-serif;">GW</text>

  <!-- Gateway sensor right -->
  <rect x="326" y="398" width="30" height="22" rx="3" fill="#2471a3" stroke="#1a5276" stroke-width="1"/>
  <rect x="330" y="401" width="22" height="7" rx="1" fill="#5dade2"/>
  <text x="341" y="415" text-anchor="middle" dominant-baseline="central" style="fill:white;font-size:6.5px;font-weight:700;font-family:'Segoe UI',sans-serif;">GW</text>

  <!-- ===== WIRING (blue lines connecting sensors to gateway) ===== -->
  <!-- Left vertical wire: sensors left side → gateway -->
  <polyline points="90,48 80,48 80,409 186,409" fill="none" stroke="#1a7abf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tap floor 5 left -->
  <line x1="118" y1="48" x2="90" y2="48" stroke="#1a7abf" stroke-width="1.8"/>
  <!-- Tap floor 3 left -->
  <line x1="118" y1="228" x2="80" y2="228" stroke="#1a7abf" stroke-width="1.8"/>
  <line x1="80" y1="48" x2="80" y2="228" stroke="#1a7abf" stroke-width="1.8"/>
  <!-- Tap floor 2 left -->
  <line x1="118" y1="318" x2="80" y2="318" stroke="#1a7abf" stroke-width="1.8"/>
  <line x1="80" y1="228" x2="80" y2="409" stroke="#1a7abf" stroke-width="1.8"/>

  <!-- Right vertical wire: sensors right side → gateway -->
  <polyline points="422,48 468,48 468,409 356,409" fill="none" stroke="#1a7abf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tap floor 5 right -->
  <line x1="422" y1="48" x2="468" y2="48" stroke="#1a7abf" stroke-width="1.8"/>
  <!-- Tap floor 4 right -->
  <line x1="422" y1="138" x2="468" y2="138" stroke="#1a7abf" stroke-width="1.8"/>
  <line x1="468" y1="48" x2="468" y2="138" stroke="#1a7abf" stroke-width="1.8"/>
  <!-- Tap floor 2 right -->
  <line x1="422" y1="318" x2="468" y2="318" stroke="#1a7abf" stroke-width="1.8"/>
  <line x1="468" y1="138" x2="468" y2="409" stroke="#1a7abf" stroke-width="1.8"/>

  <!-- ===== FLOOR LABELS ===== -->
  <text x="94" y="103" text-anchor="middle" style="fill:#444;font-size:10px;font-family:'Segoe UI',sans-serif;font-weight:600;">5F</text>
  <text x="94" y="193" text-anchor="middle" style="fill:#444;font-size:10px;font-family:'Segoe UI',sans-serif;font-weight:600;">4F</text>
  <text x="94" y="283" text-anchor="middle" style="fill:#444;font-size:10px;font-family:'Segoe UI',sans-serif;font-weight:600;">3F</text>
  <text x="94" y="373" text-anchor="middle" style="fill:#444;font-size:10px;font-family:'Segoe UI',sans-serif;font-weight:600;">2F</text>
  <text x="94" y="430" text-anchor="middle" style="fill:#444;font-size:10px;font-family:'Segoe UI',sans-serif;font-weight:600;">1F</text>

  <!-- ===== GATEWAY DEVICE (ShAkeLog box bottom left) ===== -->
  <rect x="30" y="468" width="120" height="80" rx="6" fill="#f5f5f0" stroke="#aaa" stroke-width="1.5"/>
  <!-- Screen/label area -->
  <rect x="38" y="476" width="70" height="40" rx="3" fill="white" stroke="#ccc" stroke-width="1"/>
  <!-- ShAkeLog text -->

  <!-- ECG line -->
  <rect x="42" y="483" width="63" height="2" fill="#ccc"/>
  <rect x="42" y="487" width="63" height="2" fill="#ccc"/>
  <polyline points="42,500 50,500 54,494 58,506 62,494 66,506 70,500 105,500" fill="none" stroke="#c0392b" stroke-width="1.2"/>

  <!-- Sensequake label -->
  <!-- Connectors -->
  <circle cx="48" cy="530" r="7" fill="#888" stroke="#555" stroke-width="1"/>
  <circle cx="48" cy="530" r="4" fill="#555"/>
  <circle cx="70" cy="530" r="7" fill="#888" stroke="#555" stroke-width="1"/>
  <circle cx="70" cy="530" r="4" fill="#555"/>
  <!-- Antenna -->
  <line x1="130" y1="468" x2="138" y2="450" stroke="#888" stroke-width="1.5"/>
  <circle cx="138" cy="448" r="2" fill="#888"/>

  <!-- GATEWAY label -->
  <text x="270" y="445" text-anchor="middle" style="fill:#1a5276;font-size:13px;font-weight:700;font-family:'Segoe UI',sans-serif;">GATEWAY</text>
  <line x1="216" y1="440" x2="246" y2="440" stroke="#1a7abf" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="294" y1="440" x2="324" y2="440" stroke="#1a7abf" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Legend -->
  <rect x="350" y="468" width="170" height="90" rx="6" fill="rgba(255,255,255,0.85)" stroke="#ccc" stroke-width="1"/>
  <text x="435" y="484" text-anchor="middle" style="fill:#333;font-size:11px;font-weight:700;font-family:'Segoe UI',sans-serif;">Legend</text>
  <!-- Sensor -->
  <rect x="364" y="492" width="16" height="12" rx="2" fill="#c0392b" stroke="#7b241c" stroke-width="0.8"/>
  <text x="386" y="502" text-anchor="start" style="fill:#333;font-size:10px;font-family:'Segoe UI',sans-serif;">Sensor (S)</text>
  <!-- Gateway -->
  <rect x="364" y="512" width="16" height="12" rx="2" fill="#2471a3" stroke="#1a5276" stroke-width="0.8"/>
  <text x="386" y="522" text-anchor="start" style="fill:#333;font-size:10px;font-family:'Segoe UI',sans-serif;">Gateway node</text>
  <!-- Wire -->
  <line x1="364" y1="538" x2="380" y2="538" stroke="#1a7abf" stroke-width="2"/>
  <text x="386" y="542" text-anchor="start" style="fill:#333;font-size:10px;font-family:'Segoe UI',sans-serif;">Data cable</text>

</svg>
